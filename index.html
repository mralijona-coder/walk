<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ночная прогулка</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f4f8;
            /* Спокойный ночной фон */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            /* Чтобы экран не дёргался при побеге кнопки */
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: #1a237e;
            /* Цвет индиго */
            font-size: 26px;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .buttons-area {
            position: relative;
            height: 350px;
            /* Пространство для маневров кнопки */
            width: 100%;
        }

        .btn {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            position: absolute;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
            left: 15%;
            top: 150px;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            left: 60%;
            top: 150px;
            transition: all 0.12s ease-out;
            /* Плавный прыжок кнопки */
            touch-action: none;
            /* Важно для мобилок: отменяет стандартные жесты */
        }

        /* Экран успешного ответа */
        .success-screen {
            display: none;
        }

        .success-screen h2 {
            color: #4caf50;
            font-size: 32px;
            margin-bottom: 15px;
        }

        .success-screen p {
            font-size: 20px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Главный экран с вопросом -->
        <div id="quizScreen">
            <h1>Пойдёшь ли ты со мной на ночную прогулку? 🌌</h1>
            <div class="buttons-area">
                <button id="yesBtn" class="btn">Да</button>
                <button id="noBtn" class="btn">Нет</button>
            </div>
        </div>

        <!-- Экран после нажатия "Да" -->
        <div id="successScreen" class="success-screen">
            <h2>О, как я и ожидал! 😏</h2>
            <p>Жду тебя после смены, обязательно проведу тебя до дома. ✨</p>
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizScreen = document.getElementById('quizScreen');
        const successScreen = document.getElementById('successScreen');

        // Функция перемещения кнопки "Нет"
        function moveButton() {
            // Генерируем случайные координаты внутри зоны кнопок
            // Ограничиваем от 5% до 80%, чтобы кнопка не улетала за экран смартфона
            const randomX = Math.floor(Math.random() * 75) + 5;
            const randomY = Math.floor(Math.random() * 80) + 10;

            noBtn.style.left = randomX + '%';
            noBtn.style.top = randomY + 'px';
        }

        // События для ПК (наведение мышки)
        noBtn.addEventListener('mouseenter', moveButton);

        // События для Телефонов (касание экрана)
        noBtn.addEventListener('touchstart', function (e) {
            e.preventDefault(); // Запрещаем стандартный клик телефона
            moveButton();
        });
        noBtn.addEventListener('click', moveButton);

        // Когда нажали "Да"
        yesBtn.addEventListener('click', function () {
            quizScreen.style.display = 'none'; // Прячем вопрос
            successScreen.style.display = 'block'; // Показываем текст
        });
    </script>

</body>

</html>
